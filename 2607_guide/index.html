<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대만 한인회 - 개발 문서</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 260px;
      --header-h: 52px;
      --bg: #f5f6f8;
      --sidebar-bg: #1a1d23;
      --sidebar-hover: #2a2f3a;
      --sidebar-active: #2563eb;
      --sidebar-text: #a0aab8;
      --sidebar-text-active: #ffffff;
      --sidebar-section: #5a6478;
      --content-bg: #ffffff;
      --border: #e4e7ed;
      --text: #1a1d23;
      --text-sub: #6b7280;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --code-bg: #f1f3f7;
      --code-border: #dde1ea;
      --table-head: #f8f9fb;
      --blockquote-border: #2563eb;
      --blockquote-bg: #f0f5ff;
      --tag-bg: #e8f0fe;
      --tag-text: #1d4ed8;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--header-h);
      background: var(--sidebar-bg);
      display: flex; align-items: center; gap: 14px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    header .logo-mark {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    header .logo-mark span {
      color: #fff; font-size: 13px; font-weight: 700; letter-spacing: -0.5px;
    }

    header .title {
      color: #ffffff; font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
    }

    header .subtitle {
      color: var(--sidebar-text); font-size: 12px; font-weight: 400;
    }

    header .spacer { flex: 1; }

    header .badge {
      background: rgba(37,99,235,0.25);
      color: #93c5fd;
      font-size: 11px; font-weight: 500;
      padding: 3px 10px; border-radius: 99px;
      border: 1px solid rgba(37,99,235,0.3);
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      margin-top: var(--header-h);
      height: calc(100vh - var(--header-h));
    }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      flex-shrink: 0;
      overflow-y: auto;
      padding: 16px 0 24px;
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .nav-section {
      padding: 16px 16px 4px;
    }

    .nav-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--sidebar-section);
      padding: 0 4px 6px;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--sidebar-text);
      font-size: 13px; font-weight: 400;
      transition: background 0.15s, color 0.15s;
      margin: 1px 0;
      border: none; background: transparent; width: 100%; text-align: left;
    }

    .nav-item:hover { background: var(--sidebar-hover); color: #d1d5db; }

    .nav-item.active {
      background: var(--sidebar-active);
      color: var(--sidebar-text-active);
      font-weight: 500;
    }

    .nav-item .nav-icon {
      width: 20px; height: 20px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
    }

    .nav-item.active .nav-icon {
      background: rgba(255,255,255,0.2);
    }

    .nav-item .nav-label { flex: 1; }

    .nav-item .nav-tag {
      font-size: 10px; padding: 1px 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      color: var(--sidebar-text);
    }

    .nav-item.active .nav-tag {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .nav-divider {
      height: 1px; background: rgba(255,255,255,0.05);
      margin: 8px 16px;
    }

    /* ── Content ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 36px 48px;
      background: var(--bg);
    }

    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

    .content-card {
      background: var(--content-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 40px 48px;
      width: 90%;
      max-width: 90%;
    }

    .content-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .content-header .doc-type-badge {
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 9px; border-radius: 5px;
      background: var(--tag-bg); color: var(--tag-text);
    }

    .content-header .doc-filename {
      font-size: 12px; color: var(--text-sub); font-family: 'JetBrains Mono', monospace;
    }

    /* ── Markdown Styles ── */
    .md-body h1 {
      font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
      color: var(--text); margin: 0 0 8px;
      line-height: 1.3;
    }

    .md-body h2 {
      font-size: 17px; font-weight: 650; letter-spacing: -0.2px;
      color: var(--text);
      margin: 32px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .md-body h3 {
      font-size: 14px; font-weight: 600;
      color: var(--text);
      margin: 22px 0 8px;
    }

    .md-body h4 {
      font-size: 13px; font-weight: 600; color: var(--text-sub);
      margin: 16px 0 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .md-body p {
      font-size: 14px; line-height: 1.75; color: #374151;
      margin-bottom: 12px;
    }

    .md-body ul, .md-body ol {
      padding-left: 20px; margin-bottom: 12px;
    }

    .md-body li {
      font-size: 14px; line-height: 1.75; color: #374151;
      margin-bottom: 4px;
    }

    .md-body li > ul, .md-body li > ol { margin-top: 4px; margin-bottom: 0; }

    .md-body a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .md-body a:hover { text-decoration: underline; }

    .md-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      background: var(--code-bg);
      color: #c92a2a;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--code-border);
    }

    .md-body pre {
      background: #1a1d23;
      border-radius: 8px;
      padding: 18px 20px;
      margin: 14px 0;
      overflow-x: auto;
      border: 1px solid #2d3340;
      position: relative;
    }

    .md-body pre code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px; line-height: 1.7;
      background: none; border: none; padding: 0;
      color: #abb2bf;
    }

    .md-body blockquote {
      border-left: 3px solid var(--blockquote-border);
      background: var(--blockquote-bg);
      padding: 12px 16px;
      margin: 14px 0;
      border-radius: 0 6px 6px 0;
    }

    .md-body blockquote p {
      margin: 0; color: #1e40af; font-size: 13.5px;
    }

    .md-body table {
      width: 100%; border-collapse: collapse;
      margin: 14px 0; font-size: 13.5px;
      border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden;
    }

    .md-body th {
      background: var(--table-head);
      font-weight: 600; text-align: left;
      padding: 10px 14px; color: var(--text);
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
    }

    .md-body td {
      padding: 10px 14px; color: #374151;
      border-bottom: 1px solid var(--border);
    }

    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: var(--bg); }

    .md-body hr {
      border: none; border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    .md-body strong { font-weight: 650; color: var(--text); }

    /* ── Welcome screen ── */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; text-align: center; gap: 16px;
      color: var(--text-sub);
    }

    .welcome .welcome-icon {
      width: 56px; height: 56px;
      background: var(--accent-light);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }

    .welcome h2 { font-size: 18px; font-weight: 600; color: var(--text); }
    .welcome p { font-size: 13.5px; max-width: 320px; line-height: 1.6; }

    .quick-links {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      margin-top: 8px;
    }

    .quick-link {
      padding: 8px 16px;
      background: var(--content-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px; color: var(--accent);
      cursor: pointer; font-weight: 500;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .quick-link:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark"><span>KT</span></div>
  <div>
    <div class="title">Korea Taiwan Association</div>
    <div class="subtitle">개발 문서 포털</div>
  </div>
  <div class="spacer"></div>
  <span class="badge">로컬 셋팅 가이드</span>
</header>

<div class="layout">

  <aside>
    <div class="nav-section">
      <div class="nav-section-label">시작하기</div>
      <button class="nav-item active" onclick="loadDoc('README.md', '공통 셋팅 가이드', 'Guide', this)">
        <div class="nav-icon">R</div>
        <span class="nav-label">공통 셋팅 가이드</span>
        <span class="nav-tag">Start</span>
      </button>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-section">
      <div class="nav-section-label">프로젝트 설치</div>
      <button class="nav-item" onclick="loadDoc('koreaTaiwan_README.md', 'Frontend 가이드', 'Frontend', this)">
        <div class="nav-icon">F</div>
        <span class="nav-label">Frontend (React Native)</span>
        <span class="nav-tag">Expo</span>
      </button>
      <button class="nav-item" onclick="loadDoc('koreaTaiwanApi_README.md', 'Backend 가이드', 'Backend', this)">
        <div class="nav-icon">B</div>
        <span class="nav-label">Backend (Spring Boot)</span>
        <span class="nav-tag">API</span>
      </button>
    </div>



    <div class="nav-divider"></div>

    <div class="nav-section">
      <div class="nav-section-label">기타</div>
      <button class="nav-item" onclick="loadDoc('policy.md', '중요 확정 정책', 'Policy', this)">
        <div class="nav-icon">P</div>
        <span class="nav-label">중요 확정 정책</span>
        <span class="nav-tag">Policy</span>
      </button>
      <button class="nav-item" onclick="loadDoc('todo.md', 'TODO LIST', 'TODO', this)">
        <div class="nav-icon">T</div>
        <span class="nav-label">TODO LIST</span>
        <span class="nav-tag">Task</span>
      </button>
      <button class="nav-item" onclick="location.href='dev_checklist.html'">
        <div class="nav-icon">D</div>
        <span class="nav-label">약관</span>
        <span class="nav-tag">Terms</span>
      </button>
      <button class="nav-item" onclick="loadDoc('LICENSE.md', '라이선스', 'License', this)">
        <div class="nav-icon">L</div>
        <span class="nav-label">라이선스</span>
      </button>
    </div>
  </aside>

  <main id="main-content">
    <div class="content-card">
      <div class="content-header" id="content-header" style="display:none;"></div>
      <div class="md-body" id="md-body"></div>
    </div>
  </main>

</div>

<script>
  const cache = {};

  function openExternal(url) {
    window.open(url, '_blank');
  }

  function setActive(btn) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
  }

  async function loadDoc(filename, label, type, btn) {
    if (btn) setActive(btn);

    const header = document.getElementById('content-header');
    const body = document.getElementById('md-body');

    header.style.display = 'flex';
    header.innerHTML = `<span class="doc-type-badge">${type}</span><span class="doc-filename">${filename}</span>`;
    body.innerHTML = '<p style="color:#9ca3af;font-size:13px;">불러오는 중...</p>';

    try {
      let text;
      if (cache[filename]) {
        text = cache[filename];
      } else {
        const res = await fetch(filename);
        if (!res.ok) throw new Error(`${res.status}`);
        text = await res.text();
        cache[filename] = text;
      }
      body.innerHTML = marked.parse(text);
    } catch (e) {
      body.innerHTML = `<p style="color:#dc2626;font-size:13px;">파일을 불러올 수 없습니다: <code>${filename}</code></p>`;
    }
  }

  // 페이지 로드 시 첫 문서 자동 로드
  window.addEventListener('DOMContentLoaded', () => {
    const firstBtn = document.querySelector('.nav-item');
    loadDoc('README.md', '공통 셋팅 가이드', 'Guide', firstBtn);
  });
</script>

</body>
</html>
