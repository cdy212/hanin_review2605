<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMO Kanban Board</title>
    <style>
        :root {
            --page: #f6f7f9;
            --surface: #ffffff;
            --ink: #17191d;
            --muted: #667080;
            --line: #dde3eb;
            --red: #c52233;
            --blue: #1f63d9;
            --green: #0c7a43;
            --amber: #a15c07;
            --violet: #6544c0;
            --shadow: 0 10px 24px rgba(23, 25, 29, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
            line-height: 1.45;
        }

        .board-shell {
            width: min(1720px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 16px;
            margin-bottom: 18px;
        }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--red);
            font-size: 0.78rem;
            font-weight: 900;
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 6px;
            font-size: 1.7rem;
            line-height: 1.18;
        }

        .lead {
            max-width: 860px;
            margin-bottom: 0;
            color: var(--muted);
            font-size: 0.94rem;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .chip,
        .tag {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--muted);
            font-size: 0.74rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .chip {
            min-height: 30px;
            padding: 5px 10px;
        }

        .tag {
            padding: 3px 8px;
        }

        .tag.red {
            border-color: #f0b8c0;
            background: #fff0f2;
            color: var(--red);
        }

        .tag.blue {
            border-color: #bcd0fb;
            background: #eef5ff;
            color: var(--blue);
        }

        .tag.green {
            border-color: #b8dec9;
            background: #edf8f1;
            color: var(--green);
        }

        .tag.amber {
            border-color: #f0d28f;
            background: #fff6df;
            color: var(--amber);
        }

        .tag.violet {
            border-color: #d6ccfb;
            background: #f3efff;
            color: var(--violet);
        }

        .kanban {
            display: grid;
            grid-template-columns: repeat(5, minmax(260px, 1fr));
            gap: 14px;
            align-items: start;
        }

        .column {
            min-height: 76vh;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.72);
            padding: 12px;
        }

        .column-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .column-head h2 {
            margin-bottom: 0;
            font-size: 0.96rem;
        }

        .count {
            display: inline-grid;
            place-items: center;
            min-width: 28px;
            height: 24px;
            border-radius: 999px;
            background: #eef1f5;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 900;
        }

        .card-stack {
            display: grid;
            gap: 9px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--surface);
            padding: 11px;
            box-shadow: var(--shadow);
        }

        .card.important {
            border-left: 5px solid var(--red);
        }

        .card.todo {
            border-left: 5px solid var(--blue);
        }

        .card.blocked {
            border-left: 5px solid var(--amber);
        }

        .card.draft {
            border-left: 5px solid var(--violet);
        }

        .card.done {
            border-left: 5px solid var(--green);
        }

        .card h3 {
            margin-bottom: 6px;
            font-size: 0.92rem;
            line-height: 1.3;
        }

        .card p {
            margin-bottom: 0;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 9px;
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 9px;
            padding: 12px;
            color: var(--muted);
            font-size: 0.82rem;
            text-align: center;
        }

        @media (max-width: 1420px) {
            .kanban {
                grid-template-columns: repeat(3, minmax(260px, 1fr));
            }
        }

        @media (max-width: 920px) {
            .topbar {
                display: block;
            }

            .chips {
                justify-content: flex-start;
                margin-top: 12px;
            }

            .kanban {
                grid-template-columns: 1fr;
            }

            .column {
                min-height: auto;
            }
        }
    </style>
</head>

<body>
    <main class="board-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">AI PMO / Kanban</p>
                <h1>대만한인회 리뉴얼 칸반 보드</h1>
                <p class="lead">현재 결정해야 할 사안, 진행해야 할 작업, 검토 보류 항목, 작업 GitHub 발행 대기, 완료된 정리 작업만 압축해서 보여줍니다.</p>
            </div>
            <div class="chips" id="summaryChips"></div>
        </header>

        <section class="kanban" id="kanbanBoard" aria-label="PMO Kanban Board"></section>
    </main>

    <script src="pmo/pmo_data.js"></script>
    <script>
        const state = window.PMO_STATE || {};
        const applyPlan = window.PMO_APPLY_PLAN || {};
        const reviewPlan = window.PMO_REVIEW_PLAN || {};

        const columns = [
            { id: 'important', title: '중요 결정', tone: 'important' },
            { id: 'todo', title: '진행해야 할 일', tone: 'todo' },
            { id: 'blocked', title: '검토 / 보류', tone: 'blocked' },
            { id: 'draft', title: '작업 발행 대기', tone: 'draft' },
            { id: 'done', title: '완료 / 정리됨', tone: 'done' }
        ];

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function tag(text, tone) {
            return el('span', `tag ${tone || ''}`.trim(), text);
        }

        function card({ title, body, tags = [], tone }) {
            const item = el('article', `card ${tone}`);
            item.append(el('h3', '', title));
            if (body) item.append(el('p', '', body));
            if (tags.length) {
                const meta = el('div', 'meta');
                tags.forEach(itemTag => meta.append(tag(itemTag.label, itemTag.tone)));
                item.append(meta);
            }
            return item;
        }

        function buildBoardData() {
            const important = (state.decisions || []).map(item => ({
                title: item.title,
                body: item.body,
                tone: 'important',
                tags: [
                    { label: item.badge || 'Decision', tone: item.level === 'high' ? 'red' : 'amber' }
                ]
            }));

            const todo = (state.todos || []).map(item => ({
                title: item.title,
                body: item.body,
                tone: 'todo',
                tags: [
                    { label: item.p || 'TODO', tone: item.p === 'P0' ? 'red' : 'blue' },
                    { label: item.owner || '담당 미정' },
                    { label: item.targetRepo || 'review', tone: item.targetRepo === 'review' ? 'green' : 'violet' }
                ]
            }));

            const blocked = [];
            if (applyPlan.reviewGate) {
                blocked.push({
                    title: 'FRONT/BACK Issue 발행 보류',
                    body: applyPlan.reviewGate.reason,
                    tone: 'blocked',
                    tags: [
                        { label: applyPlan.reviewGate.status || 'pending', tone: 'amber' },
                        { label: applyPlan.reviewGate.sourceMeeting || '회의록' }
                    ]
                });
            }
            (reviewPlan.items || []).forEach(item => {
                blocked.push({
                    title: item.category,
                    body: item.decisionNeeded,
                    tone: 'blocked',
                    tags: [
                        { label: item.recommendedDecision || 'discuss', tone: 'amber' },
                        { label: item.applyPolicy || '검토 필요' }
                    ]
                });
            });

            const draft = (applyPlan.items || []).map(item => ({
                title: item.title,
                body: item.body,
                tone: 'draft',
                tags: [
                    { label: item.status || 'draft', tone: 'violet' },
                    { label: item.targetRepo || 'repo 미정' },
                    { label: item.priority || 'Priority' }
                ]
            }));

            const done = [
                {
                    title: '260513 회의록 기준 정리',
                    body: '회의록 기반 의사결정, TODO, 확인 필요사항 초안 정리 완료.',
                    tone: 'done',
                    tags: [{ label: '완료', tone: 'green' }]
                },
                {
                    title: '260515 한인회 의견 비교표 생성',
                    body: '기존 기준안과 한인회 의견 차이를 검토 게이트로 분리.',
                    tone: 'done',
                    tags: [{ label: '완료', tone: 'green' }]
                },
                {
                    title: 'file:// 대응 데이터 번들 생성',
                    body: 'pmo_data.js로 JSON fetch 없이도 로컬 확인 가능.',
                    tone: 'done',
                    tags: [{ label: '완료', tone: 'green' }]
                }
            ];

            return { important, todo, blocked, draft, done };
        }

        function renderSummary(data) {
            const root = document.getElementById('summaryChips');
            root.innerHTML = '';
            columns.forEach(column => {
                const count = data[column.id]?.length || 0;
                root.append(el('span', 'chip', `${column.title} ${count}`));
            });
        }

        function renderBoard() {
            const data = buildBoardData();
            renderSummary(data);
            const root = document.getElementById('kanbanBoard');
            root.innerHTML = '';

            columns.forEach(column => {
                const section = el('section', 'column');
                const head = el('div', 'column-head');
                head.append(el('h2', '', column.title), el('span', 'count', String(data[column.id]?.length || 0)));
                const stack = el('div', 'card-stack');
                const items = data[column.id] || [];
                if (!items.length) {
                    stack.append(el('div', 'empty', '표시할 항목 없음'));
                } else {
                    items.forEach(item => stack.append(card(item)));
                }
                section.append(head, stack);
                root.append(section);
            });
        }

        renderBoard();
    </script>
</body>

</html>
